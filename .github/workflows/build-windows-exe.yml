name: Build Windows EXE

# Builds a standalone Windows .exe of the Visio Text Replacer and uploads it
# as a downloadable artifact. Runs automatically on pushes to the feature
# branch, and can also be started manually from the Actions tab
# ("Run workflow").

on:
  workflow_dispatch:
  push:
    branches:
      - claude/visio-text-replace-pdf-3fpldd
    paths:
      - visio_replace_tool.py
      - .github/workflows/build-windows-exe.yml

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build the EXE
        run: pyinstaller --onefile --windowed --name VisioTextReplacer visio_replace_tool.py

      - name: Upload the EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisioTextReplacer-windows
          path: dist/VisioTextReplacer.exe
          if-no-files-found: error
